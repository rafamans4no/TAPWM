<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maiúsculas e Minúsculas</title>
<style>
    body {
        background-color: #ffe6f0;
        font-family: "Comic Sans MS", "Poppins", cursive, sans-serif;
        text-align: center;
        padding: 50px;
        color: #ff66a3;
    }

    h1 {
        color: #ff4d94;
        font-size: 2.8em;
        margin-bottom: 10px;
    }

    h2 {
        color: #ff66a3;
        margin-bottom: 30px;
    }

    button {
        background-color: #ff99c8;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1em;
        margin: 10px;
        box-shadow: 2px 2px 5px #ffb3cc;
        transition: background-color 0.3s;
    }

    button:hover {
        background-color: #ff66a3;
    }

    #resultado {
        margin-top: 30px;
        background-color: #fff0f5;
        padding: 20px;
        border-radius: 20px;
        border: 2px dashed #ffb3cc;
        display: inline-block;
        width: 70%;
        min-height: 150px;
        box-shadow: 2px 2px 8px #ffcce0;
        color: #cc3366;
        font-size: 1.1em;
        white-space: pre-wrap;
    }
</style>
<script>
    function mudarTexto() {
        var campo = document.getElementById("texto");
        var radios = document.getElementsByName("opcao");

        if (radios[0].checked) {
            campo.value = campo.value.toUpperCase();
        } 
        else if (radios[1].checked) {
            campo.value = campo.value.toLowerCase();
        }
    }
</script>
</head>
<body>
    <h1>🌷 Transformar Texto 🌷</h1>
    <h2>Escolha como quer transformar o texto:</h2>
    <input type="text" id="texto" placeholder="Digite algo...">

    <br><br>

    <input type="radio" name="opcao" onclick="mudarTexto()"> Maiúsculas
    <br>
    <input type="radio" name="opcao" onclick="mudarTexto()"> Minúsculas
</body>
</html>
