<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercícios JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Soma e Quadrados 🌷</h2>
    <label>Digite 3 números separados por vírgula:</label><br>
    <input type="text" id="numerosInput">
    <button onclick="SomaQuadrados()">Calcular</button>
    <div class="resultado" id="resultado1"></div>
  </div>

  <div class="container">
    <h2>Gerar 10 palavras de 5 letras 🌷</h2>
    <label>Digite 5 letras separadas por vírgula:</label><br>
    <input type="text" id="letrasInput">
    <button onclick="gerarPalavras()">Mostrar Palavras</button>
    <div class="resultado" id="resultado2"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
